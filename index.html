<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Join our Telegram channel</title>
  <meta name="description" content="Join our Telegram channel in one click">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg-from: #0f172a;
      --bg-to: #1e293b;
      --ink: #e2e8f0;
      --ink-soft: #64748b;
      --foot-link: #94a3b8;
      --foot-link-active: #e2e8f0;
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg-from: #f8fafc;
        --bg-to: #e2e8f0;
        --ink: #1e293b;
        --ink-soft: #64748b;
        --foot-link: #64748b;
        --foot-link-active: #0f172a;
      }
    }

    html { height: 100%; background: var(--bg-to); }
    body { height: 100%; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(to bottom, var(--bg-from), var(--bg-to));
      color: var(--ink);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      min-height: 100dvh;
    }

    .board {
      width: 100%;
      flex: 1;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .action-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 22px 48px;
      border-radius: 60px;
      background: linear-gradient(to bottom, #37aee2, #1e96c8);
      box-shadow: 0 12px 32px rgba(30, 150, 200, 0.45);
      color: #fff;
      font-size: 22px;
      font-weight: 700;
      text-decoration: none;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .action-button:hover { transform: translateY(-2px); box-shadow: 0 16px 40px rgba(30, 150, 200, 0.6); }
    .action-button:active { transform: translateY(0); }
    .action-button svg { width: 30px; height: 30px; fill: #fff; flex-shrink: 0; }

    .footer-strip {
      width: 100%;
      padding: 28px 16px 36px;
      text-align: center;
      font-size: 13px;
      color: var(--ink-soft);
    }

    .footer-strip a {
      margin: 0 8px;
      color: var(--foot-link);
      white-space: nowrap;
      text-decoration: none;
    }

    .footer-strip a:hover { text-decoration: underline; color: var(--foot-link-active); }

    .separator { margin: 0 8px; }

    @media (max-width: 480px) {
      .action-button { font-size: 19px; padding: 18px 32px; gap: 12px; max-width: 100%; }
      .action-button svg { width: 26px; height: 26px; }
      .footer-strip { padding: 24px 16px calc(24px + env(safe-area-inset-bottom)); }
      .footer-strip a { display: block; margin: 8px 0; }
      .separator { display: none; }
    }
  </style>

  <script>
    function readParam(key) {
      return new URLSearchParams(window.location.search).get(key);
    }

    const metaPixelId = readParam("pixel");

    if (metaPixelId) {
      !(function (win, doc, tagName, srcUrl, proto, node, firstScript) {
        if (win.fbq) return;
        proto = win.fbq = function () {
          proto.callMethod
            ? proto.callMethod.apply(proto, arguments)
            : proto.queue.push(arguments);
        };
        if (!win._fbq) win._fbq = proto;
        proto.push = proto;
        proto.loaded = true;
        proto.version = "2.0";
        proto.queue = [];
        node = doc.createElement(tagName);
        node.async = true;
        node.src = srcUrl;
        firstScript = doc.getElementsByTagName(tagName)[0];
        firstScript.parentNode.insertBefore(node, firstScript);
      })(window, document, "script", "https://connect.facebook.net/en_US/fbevents.js");

      fbq("init", metaPixelId);
      fbq("track", "PageView");
    }
  </script>
</head>
<body>
  <main class="board">
    <a class="action-button" href="tg://join?invite=DQ6BiJGdcNJiOWRi" onclick="window.fbq && fbq('track', 'Lead')">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M9.78 18.65l.28-4.23 7.68-6.92c.34-.31-.07-.46-.52-.19L7.74 12.86 3.64 11.6c-.88-.25-.89-.86.2-1.3l15.97-6.16c.73-.33 1.43.18 1.15 1.3l-2.72 12.81c-.19.91-.74 1.13-1.5.71L12.6 16.3l-1.99 1.93c-.23.23-.42.42-.83.42z"/>
      </svg>
      Join us on Telegram
    </a>
  </main>

  <footer class="footer-strip">
    <a href="privacy.html">Privacy Policy</a><span class="separator">·</span><a href="cookies.html">Cookies</a><span class="separator">·</span><a href="terms.html">Terms of Use</a>
  </footer>
</body>
</html>
